<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reservation</title>
</head>
<body>
    <h2>Finalize Reservation</h2>
    <form action="/cars/res/finish" method="post">
        <input type="hidden" name="carId" th:value="${userSelectionDTO.getCarId()}"/>
        <input type="hidden" name="startDate" th:value="${userSelectionDTO.getResDateDTO().getStartDate()}"/>
        <input type="hidden" name="endDate" th:value="${userSelectionDTO.getResDateDTO().getEndDate()}"/>
        <input type="hidden" name="totalPrice" th:value="${userSelectionDTO.getTotalPrice()}"/>
        <label>Name:
            <input type="text" name="name" />
        </label>
        <br>
        <label>Email:
            <input type="email" name="email" />
        </label>
        <br>
        <label>Address:
            <input type="text" name="address" />
        </label>
        <br>
        <label>Phone:
            <input type="text" name="phone" />
        </label>
        <p th:text="'Total: ' + ${userSelectionDTO.getTotalPrice()}"></p>
        <p th:text="'Rent Days: ' + ${userSelectionDTO.getRentDays()}"></p>
        <input type="submit" value="Reserve">
    </form>
</body>
</html>
